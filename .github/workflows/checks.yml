name: Checks

# PR checks. The secret scan matches the one the org runs on its private repos; keep
# GITLEAKS_VERSION and GITLEAKS_SHA256 in step with it. GitHub's own secret scanning and push
# protection are also on here, but they leave no check on a PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--no-merges $BASE_SHA..$HEAD_SHA" \
            --max-decode-depth 3 --redact --no-banner --verbose --exit-code 1

  # Customers install these files as-is, and .mcp.json starts a process on their machine, so a
  # broken or unexpected manifest should never merge unnoticed.
  manifests:
    name: manifests / json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin manifests
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n1 sh -c 'jq empty "$0" || { echo "::error file=$0::invalid JSON"; exit 1; }'
